name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (only if "custom" is selected, e.g. 1.2.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Prepare Release & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      raw_version: ${{ steps.bump.outputs.raw_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests and build
        run: |
          npm run build
          npm test

      - name: Bump version & Update files
        id: bump
        run: |
          TARGET="${{ inputs.bump }}"
          if [ "$TARGET" = "custom" ]; then
            TARGET="${{ inputs.custom_version }}"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Custom version was selected but left empty!"
            exit 1
          fi
          node scripts/bump-version.js "$TARGET"

      - name: Build with updated version
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add package.json package-lock.json src/build-info.json README.md
          git commit -m "chore: release ${{ steps.bump.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.bump.outputs.version }}" -m "Release ${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.version }}"

      - name: Update latest branch
        run: |
          git push origin HEAD:refs/heads/latest --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes
